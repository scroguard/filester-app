# cargo-deny policy: supply-chain checks run in CI (`cargo deny check`).
# https://embarkstudios.github.io/cargo-deny/

[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
]
all-features = false

[advisories]
# Fail on any RustSec advisory (vulnerability, unmaintained, unsound, yanked).
yanked = "deny"
ignore = [
    # zvariant, zbus_names and zvariant_derive are "unmaintained" only
    # because zbus 6 absorbed them; no vulnerability is reported. They reach
    # us through oo7 0.6 (the current stable release), which requires zbus 5.
    # Remove these once a stable oo7 on zbus 6 is released (0.7 is in beta).
    { id = "RUSTSEC-2026-0370", reason = "unmaintained only; via oo7 0.6 -> zbus 5, no stable upgrade" },
    { id = "RUSTSEC-2026-0371", reason = "unmaintained only; via oo7 0.6 -> zbus 5, no stable upgrade" },
    { id = "RUSTSEC-2026-0372", reason = "unmaintained only; via oo7 0.6 -> zbus 5, no stable upgrade" },
]

[licenses]
# Every dependency licence must be compatible with GPL-3.0-or-later.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "GPL-3.0-or-later",
    "ISC",
    "LGPL-2.1-or-later",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# The project deliberately uses rustls; a transitive OpenSSL dependency
# would reintroduce per-distro libssl ABI coupling.
deny = [
    { crate = "openssl-sys", reason = "use rustls; see README Security & Auditing" },
    { crate = "native-tls", reason = "use rustls; see README Security & Auditing" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
